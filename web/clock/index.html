<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: black;
    color: #00ff88;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.container {

    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: row;
    flex-wrap: wrap;

    justify-content: center;
    align-items: center;

    gap: 40px;

    box-sizing: border-box;
    padding: 20px;
}

.clock {

    flex: 1 1 400px;

    min-width: 320px;
    max-width: 700px;

    text-align: center;

    border: 1px solid #222;
    border-radius: 12px;

    background: #050505;

    padding: 25px;

    box-sizing: border-box;
}

.label {

    font-size: clamp(1.5em, 2vw, 2.5em);

    color: #888;

    margin-bottom: 15px;
}

.time {

    font-size: clamp(3em, 6vw, 6em);

    font-weight: bold;

    line-height: 1em;

    word-break: keep-all;
}

.date {

    margin-top: 15px;

    font-size: clamp(1.2em, 2vw, 2em);

    color: #cccccc;
}

</style>

</head>

<body>

<div class="container">

    <div class="clock">

        <div class="label">UTC</div>

        <div id="utc-time" class="time"></div>

        <div id="utc-date" class="date"></div>

    </div>
    
    <div class="clock">

        <div class="label">Tahiti</div>

        <div id="tahiti-time" class="time"></div>

        <div id="tahiti-date" class="date"></div>

    </div>

    <div class="clock">

        <div class="label">Paris</div>

        <div id="paris-time" class="time"></div>

        <div id="paris-date" class="date"></div>

    </div>

</div>

<script>

function updateClock(timeId, dateId, timezone) {

    const now = new Date();

    const time = now.toLocaleTimeString('fr-FR', {
        timeZone: timezone,
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
    });

    const date = now.toLocaleDateString('fr-FR', {
        timeZone: timezone,
        day: '2-digit',
        month: '2-digit',
        year: 'numeric'
    });

    document.getElementById(timeId).innerText = time;

    document.getElementById(dateId).innerText = date;
}

function updateClocks() {

    updateClock(
        'utc-time',
        'utc-date',
        'UTC'
    );

    updateClock(
        'paris-time',
        'paris-date',
        'Europe/Paris'
    );

    updateClock(
        'tahiti-time',
        'tahiti-date',
        'Pacific/Tahiti'
    );
}

updateClocks();

setInterval(updateClocks, 1000);

</script>

</body>

</html>
