<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: black;
    color: #00ff88;
    font-family: Arial, sans-serif;
}

.container {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100%;
    gap: 50px;
}

.clock {
    text-align: center;
}

.label {
    font-size: 2em;
    color: #888;
    margin-bottom: 10px;
}

.time {
    font-size: 5em;
    font-weight: bold;
    line-height: 1em;
}

.date {
    margin-top: 10px;
    font-size: 1.8em;
    color: #cccccc;
}

</style>

</head>

<body>

<div class="container">

    <div class="clock">

        <div class="label">UTC</div>

        <div id="utc-time" class="time"></div>

        <div id="utc-date" class="date"></div>

    </div>

    <div class="clock">

        <div class="label">Tahiti</div>

        <div id="utc10-time" class="time"></div>

        <div id="utc10-date" class="date"></div>

    </div>

    <div class="clock">

        <div class="label">Paris</div>

        <div id="paris-time" class="time"></div>

        <div id="paris-date" class="date"></div>

    </div>

</div>

<script>

function updateClock(timeId, dateId, timezone) {

    const now = new Date();

    const time = now.toLocaleTimeString('fr-FR', {
        timeZone: timezone,
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
    });

    const date = now.toLocaleDateString('fr-FR', {
        timeZone: timezone,
        day: '2-digit',
        month: '2-digit',
        year: 'numeric'
    });

    document.getElementById(timeId).innerText = time;
    document.getElementById(dateId).innerText = date;
}

function updateClocks() {

    updateClock(
        'utc-time',
        'utc-date',
        'UTC'
    );

    updateClock(
        'utc10-time',
        'utc10-date',
        'Pacific/Tahiti'
    );

    updateClock(
        'paris-time',
        'paris-date',
        'Europe/Paris'
    );
}

updateClocks();

setInterval(updateClocks, 1000);

</script>

</body>
</html>
